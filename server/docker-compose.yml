services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: eigent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eigent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - eigent_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eigent']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eigent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - eigent_redis_data:/data
    networks:
      - eigent_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        database_url: postgresql://postgres:123456@postgres:5432/eigent
    container_name: eigent_api
    restart: unless-stopped
    ports:
      - '3001:5678'
    env_file:
      - .env
    environment:
      - database_url=postgresql://postgres:123456@postgres:5432/eigent
      - redis_url=redis://redis:6379/0
      - celery_broker_url=redis://redis:6379/0
      - celery_result_url=redis://redis:6379/0
      - SESSION_REDIS_URL=redis://redis:6379/1
    # volumes:
    #   - ./app:/app/app
    #   - ./alembic:/app/alembic
    #   - ./lang:/app/lang
    #   - ./public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eigent_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5678/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery_worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        database_url: postgresql://postgres:123456@postgres:5432/eigent
    container_name: eigent_celery_worker
    restart: unless-stopped
    command: /app/celery/worker/start
    env_file:
      - .env
    environment:
      - database_url=postgresql://postgres:123456@postgres:5432/eigent
      - redis_url=redis://redis:6379/0
      - celery_broker_url=redis://redis:6379/0
      - celery_result_url=redis://redis:6379/0
      - SESSION_REDIS_URL=redis://redis:6379/1
    # volumes:
    #   - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eigent_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'celery -A app.core.celery inspect ping -d celery@$$HOSTNAME',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        database_url: postgresql://postgres:123456@postgres:5432/eigent
    container_name: eigent_celery_beat
    restart: unless-stopped
    command: /app/celery/beat/start
    env_file:
      - .env
    environment:
      - database_url=postgresql://postgres:123456@postgres:5432/eigent
      - redis_url=redis://redis:6379/0
      - celery_broker_url=redis://redis:6379/0
      - celery_result_url=redis://redis:6379/0
      - SESSION_REDIS_URL=redis://redis:6379/1
    # volumes:
    #   - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eigent_network

  # Pocket-to-Office (B34): listener Matrix de la sala "Mi Oficina".
  # Credenciales NP_MX_* por instancia (empleado x app x nodo): las genera
  # onboard.sh (np-sovereign-core) en <usuario>.eigent.env. Apuntar con:
  #   NP_OFFICE_ENV_FILE=./maria.eigent.env docker compose up -d np_office_listener
  # (fallback: .env, modelo legacy compartido). Requiere matrix-nio[e2e]
  # (server/pyproject.toml) y np_office/ copiado a la imagen por server/Dockerfile.
  # E2EE: device_id FIJO (NPOFFICE-EIGENT-<NODO>) + store Olm persistente; si
  # el device_id cambia entre arranques, el listener queda mudo en la sala.
  np_office_listener:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        database_url: postgresql://postgres:123456@postgres:5432/eigent
    container_name: eigent_np_office_listener
    command: ["python", "np_office/np_office_listener.py"]
    restart: unless-stopped
    env_file:
      - ${NP_OFFICE_ENV_FILE:-.env}
    environment:
      # Wiring pendiente (guia §7 #4): apuntar a la ruta real del ejecutor
      # (Camino A del np_office/README.md). El listener corre igual sin ella.
      - NP_OFFICE_TASK_URL=http://api:5678/office/task
      - database_url=postgresql://postgres:123456@postgres:5432/eigent
      - redis_url=redis://redis:6379/0
    volumes:
      - ./np_office_state:/app/.np_office   # store Olm persistente (device_id fijo)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eigent_network

volumes:
  postgres_data:
    driver: local
  eigent_redis_data:

networks:
  eigent_network:
    driver: bridge
